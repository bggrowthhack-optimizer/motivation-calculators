<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Модный взгляд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
<style>
  /* Ставки за смену — временные поля для прикидки, не основной ввод: уже сами
     суммы маленькие (3-4 цифры), на всю ширину карточки они не нужны. */
  .field-control.no-slider:has(#f-сотрудник-ставкаОптометрист),
  .field-control.no-slider:has(#f-сотрудник-ставкаКонсультант),
  .field-control.no-slider:has(#f-сотрудник-ставкаУниверсал) {
    max-width: 130px;
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.MV_NORMS;
  var N = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }
  function fmtKpi(v, unit) { return unit === 'percent' ? (Math.round(v * 10) / 10 + '%') : fmtMoney(v); }

  // Подсказка под ползунком «выполнение плана» — сколько осталось до следующей ставки и сколько это денег.
  function gradeHint(s) {
    var cur = API.gradeRate(N.грейды, s.планПроцент);
    var ng = API.nextGrade(N.грейды, s.планПроцент);
    if (!ng) {
      return 'Это самая высокая ставка — <span class="mono">' + pct(cur) + '</span>.';
    }
    var gap = ng.порог - s.планПроцент;
    var jump = (ng.ставка - cur) * s.выручка;
    return 'До плана <span class="mono">' + ng.порог + '%</span> осталось <span class="mono">' + gap.toFixed(0) +
      ' п.п.</span> — и ставка вырастет с <span class="mono">' + pct(cur) + '</span> до <span class="mono">' + pct(ng.ставка) + '</span>, это ещё <span class="mono">+' +
      fmtMoney(jump) + '/мес</span>.';
  }

  function kpiHint(s) {
    var prem = API.kpiPremium(N.kpi.ступени, s.kpiЗначение);
    var next = API.nextKpiStep(N.kpi.ступени, s.kpiЗначение);
    if (!next) {
      return 'Премия уже на максимуме — <span class="mono">+' + fmtMoney(prem) + '</span>.';
    }
    var gap = next.порог - s.kpiЗначение;
    return 'До <span class="mono">' + fmtKpi(next.порог, N.kpi.unit) + '</span> не хватает <span class="mono">' +
      fmtKpi(gap, N.kpi.unit) + '</span> — тогда премия станет <span class="mono">' +
      fmtMoney(next.премия) + '</span>' + (prem ? ' (сейчас ' + fmtMoney(prem) + ')' : '') + '.';
  }

  function gradeFootnote() {
    var steps = N.грейды.map(function (g, i) {
      if (i === 0) return 'меньше ' + (N.грейды[1] ? N.грейды[1].порог : 100) + '% — ' + pct(g.ставка);
      if (!N.грейды[i + 1]) return 'от ' + g.порог + '% и выше — ' + pct(g.ставка);
      return g.порог + '–' + (N.грейды[i + 1].порог - 1) + '% — ' + pct(g.ставка);
    });
    return '<strong>Процент с продаж по выполнению плана:</strong> ' + steps.join('; ') + '.';
  }

  function kpiFootnote() {
    var steps = N.kpi.ступени.map(function (s) {
      return 'от ' + fmtKpi(s.порог, N.kpi.unit) + ' — ' + fmtMoney(s.премия);
    });
    return '<strong>Премия за ' + N.kpi.label.toLowerCase() + ':</strong> ' + steps.join('; ') + '.';
  }

  var kpiSliderMax = N.kpi.unit === 'percent' ? 100 : 40000;

  var role = {
    id: 'сотрудник',
    label: 'Сотрудник',
    groups: [
      {
        title: 'Смены',
        note: 'Сколько смен отработал сотрудник и по какой ставке — ставки тоже можно поменять, чтобы посмотреть, что получится.',
        fields: [
          { id: 'ставкаОптометрист', label: 'Ставка за смену оптометристом', unit: 'money', slider: false,
            min: 0, default: N.ставка.оптометрист },
          { id: 'сменОптометрист', label: 'Смен оптометристом за месяц', unit: 'count', slider: true,
            min: 0, max: 22, step: 1, default: 8, key: true },
          { id: 'ставкаКонсультант', label: 'Ставка за смену консультантом', unit: 'money', slider: false,
            min: 0, default: N.ставка.консультант },
          { id: 'сменКонсультант', label: 'Смен консультантом за месяц', unit: 'count', slider: true,
            min: 0, max: 22, step: 1, default: 8, key: true },
          { id: 'ставкаУниверсал', label: 'Ставка за смену одному за двоих', unit: 'money', slider: false,
            min: 0, default: N.ставка.универсал },
          { id: 'сменУниверсалом', label: 'Смен одному за двоих (универсалом) за месяц', unit: 'count', slider: true,
            min: 0, max: 22, step: 1, default: 3, key: true }
        ]
      },
      {
        title: 'Продажи',
        note: 'Ползунки ниже сразу показывают, как цифры продаж меняют зарплату.',
        fields: [
          { id: 'выручка', label: 'Выручка сотрудника за месяц', unit: 'money', key: true,
            min: 0, max: 1500000, step: 10000, default: 400000 },
          { id: 'планПроцент', label: 'На сколько филиал выполнил план продаж', unit: 'percent', key: true,
            min: 0, max: 140, step: 1, default: 90,
            marginal: function (s) { return gradeHint(s); } },
          { id: 'kpiЗначение', label: N.kpi.label + ' (премия начинается от ' + fmtKpi(N.kpi.ступени[0].порог, N.kpi.unit) + ')',
            unit: N.kpi.unit === 'percent' ? 'percent' : 'money', key: true,
            min: 0, max: kpiSliderMax, step: N.kpi.unit === 'percent' ? 1 : 500,
            default: Math.round(N.kpi.ступени[0].порог * 0.85),
            marginal: function (s) { return kpiHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var rate = API.gradeRate(N.грейды, s.планПроцент);
      var proc = rate * s.выручка;
      var baseShifts = s.сменОптометрист * s.ставкаОптометрист
        + s.сменКонсультант * s.ставкаКонсультант
        + s.сменУниверсалом * s.ставкаУниверсал;
      var kpiPrem = API.kpiPremium(N.kpi.ступени, s.kpiЗначение);
      return {
        rows: [
          { label: 'За смены: ' + s.сменОптометрист + ' опт. × ' + fmtMoney(s.ставкаОптометрист)
            + ' + ' + s.сменКонсультант + ' конс. × ' + fmtMoney(s.ставкаКонсультант)
            + ' + ' + s.сменУниверсалом + ' унив. × ' + fmtMoney(s.ставкаУниверсал), value: baseShifts },
          { label: 'Процент с продаж — ' + pct(rate) + ' (план выполнен на ' + s.планПроцент + '%)', value: proc },
          { label: N.kpi.label + (kpiPrem ? ' — премия есть' : ' — пока без премии'), value: kpiPrem }
        ],
        total: baseShifts + proc + kpiPrem,
        rate: rate, baseShifts: baseShifts, kpiPrem: kpiPrem
      };
    },
    tip: function (c, s) {
      var moves = [];
      var ng = API.nextGrade(N.грейды, s.планПроцент);
      if (ng) {
        moves.push({
          what: 'подтянуть план продаж до ' + ng.порог + '%',
          money: (ng.ставка - c.rate) * s.выручка
        });
      }
      var nextKpi = API.nextKpiStep(N.kpi.ступени, s.kpiЗначение);
      if (nextKpi) {
        moves.push({
          what: 'поднять ' + N.kpi.label.toLowerCase() + ' до ' + fmtKpi(nextKpi.порог, N.kpi.unit),
          money: nextKpi.премия - c.kpiPrem
        });
      }
      if (!moves.length) {
        return '<strong>Дальше расти некуда</strong> — разве что продавать больше: ставка с продаж ' + pct(c.rate) + ' уже максимальная.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Модный взгляд · мотивация персонала',
    favicon: '🕶️',
    theme: { accent: 'oklch(0.62 0.15 55)', accentDark: 'oklch(0.74 0.13 55)' },
    lede: 'Зарплата = деньги за смены + процент с продаж сотрудника + премия за месячный показатель. Впиши цифры сотрудника, нажми «Зафиксировать как сейчас» — и смотри, что выгоднее всего подтянуть. Никуда ничего не отправляется, это просто калькулятор.',
    footnotes: [
      '<strong>Зарплата = деньги за смены + процент с продаж + премия за месячный показатель.</strong>',
      'Деньги за смены — это количество отработанных смен, умноженное на ставку за каждую. Ставка разная в зависимости от роли в смену: один за двоих (универсал) получает больше, чем работа в паре.',
      gradeFootnote(),
      kpiFootnote(),
      '<strong>Это черновик.</strong> Ставки за смены и премии за показатель — пример с разговора 06.10, собственник ещё должен их утвердить. Процент с продаж не менялся с 08.09.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
