<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Модный взгляд</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.MV_NORMS;
  var NORMS = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }
  function fmtKpi(v, unit) { return unit === 'percent' ? (Math.round(v * 10) / 10 + '%') : fmtMoney(v); }

  // Подсказка под слайдером «выполнение плана» — до какого грейда тянуть и что он даёт.
  function gradeHint(s, N) {
    var cur = API.gradeRate(N.грейды, s.планПроцент);
    var ng = API.nextGrade(N.грейды, s.планПроцент);
    if (!ng) {
      return 'Максимальный грейд — ставка <span class="mono">' + pct(cur) + '</span> зафиксирована.';
    }
    var gap = ng.порог - s.планПроцент;
    var jump = (ng.ставка - cur) * s.выручка;
    return 'До грейда <span class="mono">' + ng.порог + '%</span> осталось <span class="mono">' + gap.toFixed(0) +
      ' п.п.</span> → ставка <span class="mono">' + pct(cur) + ' → ' + pct(ng.ставка) + '</span> ≈ <span class="mono">+' +
      fmtMoney(jump) + '/мес</span>';
  }

  function kpiHint(s, N) {
    var prem = API.kpiPremium(N.kpi.ступени, s.kpiЗначение);
    var next = API.nextKpiStep(N.kpi.ступени, s.kpiЗначение);
    if (!next) {
      return 'Верхняя ступень KPI взята — премия <span class="mono">+' + fmtMoney(prem) + '</span> твоя.';
    }
    var gap = next.порог - s.kpiЗначение;
    return 'До ступени <span class="mono">' + fmtKpi(next.порог, N.kpi.unit) + '</span> осталось <span class="mono">' +
      fmtKpi(gap, N.kpi.unit) + '</span> → премия <span class="mono">' + (prem ? fmtMoney(prem) + ' → ' : '') +
      fmtMoney(next.премия) + '</span>';
  }

  function makeRole(id, label, N, planNote, kpiSliderMax) {
    return {
      id: id,
      label: label,
      groups: [
        {
          title: 'Отработка',
          note: 'Ставка за смену — зависит от того, работал в паре или один за двоих (универсалом). Кто как работал — видно по графику смен.',
          fields: [
            { id: 'сменВПаре', label: 'Смен в паре за месяц', unit: 'count', slider: true,
              min: 0, max: 22, step: 1, default: 12, key: true,
              marginalLabel: null,
              marginal: function () { return 'Ставка в паре — <span class="mono">' + fmtMoney(N.ставка.впаре) + '</span>/смену.'; } },
            { id: 'сменУниверсалом', label: 'Смен универсалом за месяц', unit: 'count', slider: true,
              min: 0, max: 22, step: 1, default: 3, key: true,
              marginal: function () { return 'Ставка универсала — <span class="mono">' + fmtMoney(N.ставка.универсал) + '</span>/смену.'; } }
          ]
        },
        {
          title: 'Продажи — твои рычаги',
          note: 'Двигай ползунки — вверху видно, как меняется зарплата.',
          fields: [
            { id: 'выручка', label: 'Твоя личная выручка за месяц', unit: 'money', key: true,
              min: 0, max: 1500000, step: 10000, default: 400000 },
            { id: 'планПроцент', label: 'Выполнение плана продаж филиала', unit: 'percent', key: true,
              min: 0, max: 140, step: 1, default: 90,
              marginal: function (s) { return gradeHint(s, N); } },
            { id: 'kpiЗначение', label: 'KPI месяца — ' + N.kpi.label + ' (ступени от ' + fmtKpi(N.kpi.ступени[0].порог, N.kpi.unit) + ')',
              unit: N.kpi.unit === 'percent' ? 'percent' : 'money', key: true,
              min: 0, max: kpiSliderMax, step: N.kpi.unit === 'percent' ? 1 : 500,
              default: Math.round(N.kpi.ступени[0].порог * 0.85),
              marginal: function (s) { return kpiHint(s, N); } }
          ]
        }
      ],
      compute: function (s) {
        var rate = API.gradeRate(N.грейды, s.планПроцент);
        var proc = rate * s.выручка;
        var baseShifts = s.сменВПаре * N.ставка.впаре + s.сменУниверсалом * N.ставка.универсал;
        var kpiPrem = API.kpiPremium(N.kpi.ступени, s.kpiЗначение);
        return {
          rows: [
            { label: 'Смены: ' + s.сменВПаре + ' в паре × ' + fmtMoney(N.ставка.впаре) + ' + ' + s.сменУниверсалом + ' универсалом × ' + fmtMoney(N.ставка.универсал), value: baseShifts },
            { label: '% с продаж · ставка ' + pct(rate) + ' (план ' + s.планПроцент + '%)', value: proc },
            { label: 'KPI: ' + N.kpi.label + (kpiPrem ? ' — премия взята' : ' — ниже первой ступени'), value: kpiPrem }
          ],
          total: baseShifts + proc + kpiPrem,
          rate: rate, baseShifts: baseShifts, kpiPrem: kpiPrem
        };
      },
      tip: function (c, s) {
        var moves = [];
        var ng = API.nextGrade(N.грейды, s.планПроцент);
        if (ng) {
          moves.push({
            what: 'выполнение плана до ' + ng.порог + '%',
            money: (ng.ставка - c.rate) * s.выручка
          });
        }
        var nextKpi = API.nextKpiStep(N.kpi.ступени, s.kpiЗначение);
        if (nextKpi) {
          moves.push({
            what: N.kpi.label.toLowerCase() + ' до ' + fmtKpi(nextKpi.порог, N.kpi.unit),
            money: nextKpi.премия - c.kpiPrem
          });
        }
        if (!moves.length) {
          return '<strong>Всё на максимуме.</strong> Дальше зарплату двигает только рост личной выручки при ставке ' + pct(c.rate) + '.';
        }
        moves.sort(function (a, b) { return b.money - a.money; });
        var m = moves[0];
        return '<strong>Быстрее всего:</strong> подтяни ' + m.what + ' → примерно <strong>+' + fmtMoney(m.money) + '/мес</strong>.';
      }
    };
  }

  function gradeFootnote(N, who) {
    var steps = N.грейды.map(function (g, i) {
      if (i === 0) return 'план < ' + (N.грейды[1] ? N.грейды[1].порог : 100) + '% → ' + pct(g.ставка);
      if (!N.грейды[i + 1]) return 'от ' + g.порог + '% → ' + pct(g.ставка);
      return g.порог + '–' + (N.грейды[i + 1].порог - 1) + '% → ' + pct(g.ставка);
    });
    return '<strong>' + who + ' — грейды % от выручки (по плану филиала):</strong> ' + steps.join('; ') + '.';
  }

  function kpiFootnote(N, who) {
    var steps = N.kpi.ступени.map(function (s) {
      return 'от ' + fmtKpi(s.порог, N.kpi.unit) + ' → +' + fmtMoney(s.премия);
    });
    return '<strong>' + who + ' — ступени KPI (' + N.kpi.label.toLowerCase() + '):</strong> ' + steps.join('; ') + '.';
  }

  var опт = NORMS.оптометрист;
  var конс = NORMS.консультант;

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Модный взгляд · мотивация персонала',
    favicon: '🕶️',
    theme: { accent: 'oklch(0.62 0.15 55)', accentDark: 'oklch(0.74 0.13 55)' },
    lede: 'Зарплата = ставка за смены + % с твоих продаж + премия за KPI месяца. Выставь свои цифры, зафиксируй точку отсчёта — и смотри, что выгоднее всего подтянуть. Ничего никуда не отправляется.',
    footnotes: [
      '<strong>Зарплата = ставка за смены + % от личной выручки + премия за KPI месяца.</strong>',
      '<strong>Ставка за смену</strong> зависит от того, как ты работал в эту смену: в паре с напарником (оптометрист и консультант отдельно) или один за двоих — универсалом. Универсал получает больше, но делает работу двоих. Ставка в паре — ' + fmtMoney(опт.ставка.впаре) + '/смену, универсалом — ' + fmtMoney(опт.ставка.универсал) + '/смену (пока одинаково для обеих ролей).',
      '<strong>% от выручки</strong> зависит от того, на сколько процентов филиал выполнил план продаж — по лестнице грейдов.',
      gradeFootnote(конс, 'Консультант'),
      gradeFootnote(опт, 'Оптометрист'),
      '<strong>KPI месяца</strong> — один показатель, по ступеням: чем выше результат, тем больше премия. У обеих ролей один KPI — средний чек заказа очков (линзы + оправа), без выгоды растить только линзы отдельно от заказа.',
      kpiFootnote(конс, 'Консультант'),
      kpiFootnote(опт, 'Оптометрист'),
      '<strong>Черновик.</strong> Ставки за смены и ступени KPI зафиксированы на встрече 06.10 как пример — точные цифры утверждает собственник. Грейды % от выручки — без изменений с 08.09.'
    ],
    roles: [
      makeRole('optometrist', 'Оптометрист', опт, null, опт.kpi.unit === 'percent' ? 100 : 40000),
      makeRole('consultant', 'Консультант', конс, null, конс.kpi.unit === 'percent' ? 100 : 40000)
    ]
  });
})();
</script>
</body>
</html>
