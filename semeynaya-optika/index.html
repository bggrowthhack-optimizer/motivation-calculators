<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Семейной оптики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.SO_NORMS;
  var N = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }
  function round1(x) { return Math.round(x * 10) / 10; }

  function weightedPct(s) {
    var weighted = s.revenueRegular + s.revenueBase * N.весБазы;
    return s.planRevenue > 0 ? (weighted / s.planRevenue * 100) : 0;
  }
  function plainPct(s) {
    var plain = s.revenueRegular + s.revenueBase;
    return s.planRevenue > 0 ? (plain / s.planRevenue * 100) : 0;
  }
  function realRevenue(s) { return s.revenueRegular + s.revenueBase; }
  function checkPct(s) { return N.чек.план > 0 ? (s.factCheck / N.чек.план * 100) : 100; }
  function checkCutApplied(s) { return checkPct(s) < N.чек.порогДоли; }
  function checkCutMultiplier(s) { return checkCutApplied(s) ? (N.чек.урезаниеДо / 100) : 1; }

  // Подсказка под полем «выручка из базы» — сколько ещё нужно, чтобы допрыгнуть
  // до следующей ступени грейда, и сколько это денег.
  function gradeHint(s) {
    var wp = weightedPct(s);
    var cur = API.gradeRate(N.грейды, wp);
    var ng = API.nextGrade(N.грейды, wp);
    if (!ng) {
      return 'Взвешенный план уже в верхней ступени — ставка <span class="mono">' + pct(cur) + '</span>.';
    }
    var neededWeighted = Math.max(0, (ng.порог - wp) / 100 * s.planRevenue);
    var neededBase = N.весБазы > 0 ? neededWeighted / N.весБазы : 0;
    var realAfter = realRevenue(s) + neededBase;
    var jump = (ng.ставка - cur) * realAfter * checkCutMultiplier(s);
    return 'До ступени <span class="mono">' + ng.порог + '%</span> не хватает <span class="mono">' +
      fmtMoney(neededBase) + '</span> выручки из базы — ставка вырастет с <span class="mono">' + pct(cur) +
      '</span> до <span class="mono">' + pct(ng.ставка) + '</span>, это ещё <span class="mono">+' +
      fmtMoney(jump) + '/мес</span>.';
  }

  // Подсказка под полем «средний чек» — далеко ли до порога, при котором
  // снимается урезание премии.
  function checkHint(s) {
    var cp = checkPct(s);
    if (cp >= N.чек.порогДоли) {
      return 'Чек в норме — премия не урезается (порог <span class="mono">' + N.чек.порогДоли + '%</span> от планового <span class="mono">' + fmtMoney(N.чек.план) + '</span>).';
    }
    var neededCheck = N.чек.план * N.чек.порогДоли / 100;
    var gap = neededCheck - s.factCheck;
    var wp = weightedPct(s);
    var rate = API.gradeRate(N.грейды, wp);
    var lost = rate * realRevenue(s) * (1 - N.чек.урезаниеДо / 100);
    return 'Чек ниже порога — премия урезана до <span class="mono">' + N.чек.урезаниеДо + '%</span>. Не хватает <span class="mono">' +
      fmtMoney(gap) + '</span> до <span class="mono">' + fmtMoney(neededCheck) + '</span> — это вернёт <span class="mono">+' + fmtMoney(lost) + '/мес</span>.';
  }

  function gradeFootnote() {
    var steps = N.грейды.map(function (g, i) {
      if (i === 0) return 'меньше ' + (N.грейды[1] ? N.грейды[1].порог : 100) + '% — ' + pct(g.ставка);
      if (!N.грейды[i + 1]) return 'от ' + g.порог + '% и выше — ' + pct(g.ставка);
      return g.порог + '–' + (N.грейды[i + 1].порог - 1) + '% — ' + pct(g.ставка);
    });
    return '<strong>Процент с продаж по взвешенному выполнению плана:</strong> ' + steps.join('; ') + '.';
  }

  var role = {
    id: 'консультант',
    label: 'Консультант',
    groups: [
      {
        title: 'План и выручка',
        note: 'Выручка от клиентов, которых вернули из базы (не было дольше 12 месяцев), считается в план с весом ×' + N.весБазы + ' — она тяжелее обычной продажи, но деньги всё равно считаются от реальной суммы.',
        fields: [
          { id: 'planRevenue', label: 'План выручки на месяц', unit: 'money', key: true,
            min: 200000, max: 2000000, step: 50000, default: 1000000 },
          { id: 'revenueRegular', label: 'Выручка от обычных заказов (факт)', unit: 'money', key: true,
            min: 0, max: 2000000, step: 10000, default: 700000 },
          { id: 'revenueBase', label: 'Выручка от клиентов «из базы» (факт)', unit: 'money', key: true,
            min: 0, max: 500000, step: 5000, default: 90000,
            marginal: function (s) { return gradeHint(s); } }
        ]
      },
      {
        title: 'Средний чек',
        note: 'Ограничитель, не отдельная премия: низкий чек урезает премию за план.',
        fields: [
          { id: 'factCheck', label: 'Средний чек (факт)', unit: 'money', key: true,
            min: 2000, max: 15000, step: 100, default: 5500,
            marginal: function (s) { return checkHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var wp = weightedPct(s);
      var pp = plainPct(s);
      var rate = API.gradeRate(N.грейды, wp);
      var plainRate = API.gradeRate(N.грейды, pp);
      var real = realRevenue(s);
      var cutMult = checkCutMultiplier(s);

      var grossBonus = rate * real;
      var bonus = grossBonus * cutMult;
      var baseUplift = Math.max(0, (rate - plainRate) * real * cutMult);
      var cutLoss = grossBonus - bonus;

      var rows = [
        { label: 'Оклад', value: N.оклад },
        { label: 'Процент с продаж — ' + pct(rate) + ' (взвешенный план ' + round1(wp) + '%)', value: bonus }
      ];
      if (baseUplift > 1) {
        rows.push({ label: '— из них за счёт работы с базой (вес ×' + N.весБазы + ')', value: baseUplift });
      }
      if (cutLoss > 1) {
        rows.push({ label: '— минус урезание за низкий чек', value: -cutLoss });
      }

      return {
        rows: rows,
        total: N.оклад + bonus,
        rate: rate, plainRate: plainRate, weightedPct: wp, plainPct: pp,
        real: real, cutApplied: checkCutApplied(s), cutLoss: cutLoss
      };
    },
    tip: function (c, s) {
      var moves = [];
      var ng = API.nextGrade(N.грейды, c.weightedPct);
      if (ng) {
        var neededWeighted = Math.max(0, (ng.порог - c.weightedPct) / 100 * s.planRevenue);
        var neededBase = N.весБазы > 0 ? neededWeighted / N.весБазы : 0;
        moves.push({
          what: 'найти в базе ещё ' + fmtMoney(neededBase) + ' выручки и дойти до ступени ' + ng.порог + '%',
          money: (ng.ставка - c.rate) * (c.real + neededBase) * checkCutMultiplier(s)
        });
      }
      if (c.cutApplied) {
        moves.push({ what: 'поднять средний чек выше порога и снять урезание премии', money: c.cutLoss });
      }
      if (!moves.length) {
        return '<strong>Дальше расти в этой модели некуда</strong> — ставка ' + pct(c.rate) + ' уже максимальная, чек в норме. Разве что продавать больше.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Семейная оптика · мотивация консультантов',
    favicon: '👨‍👩‍👧',
    theme: { accent: 'oklch(0.6 0.16 25)', accentDark: 'oklch(0.72 0.14 25)' },
    lede: 'Зарплата = оклад + процент с продаж по ступени выполнения плана. Выручка от клиентов, которых вернули из базы, весит в плане тяжелее обычной — это самый быстрый способ подняться на следующую ступень. Низкий средний чек урезает премию. Впиши реальные цифры, нажми «Зафиксировать как сейчас» — и смотри, что выгоднее всего подтянуть.',
    footnotes: [
      '<strong>Зарплата = оклад + процент с продаж по ступени выполнения плана, с урезанием за низкий чек.</strong>',
      'Выручка от клиентов «из базы» считается в план с весом (сейчас ×' + N.весБазы + ') — один рубль такой выручки двигает процент выполнения плана как ' + N.весБазы + ' рубля обычной продажи. Сам бонус при этом считается от реальной заработанной суммы — вес решает только то, в какую ступень грейда попадает консультант, а не то, с какой суммы берутся деньги.',
      gradeFootnote(),
      'Средний чек — не отдельная премия, а ограничитель: план ' + fmtMoney(N.чек.план) + '. Если факт ниже ' + N.чек.порогДоли + '% от этой суммы — премия за план урезается до ' + N.чек.урезаниеДо + '% от расчётной, чтобы план нельзя было закрыть одними скидками.',
      '«Из базы» здесь — не то, что вписывает сам консультант. Это определяет система по истории клиента (нет заказов дольше 12 месяцев) и звонку, зафиксированному в CRM до визита, а не после. Премия закрывается после короткого окна на возвраты товара. Калькулятор этого не проверяет — он считает то, что уже прошло проверку.',
      '<strong>Это черновик.</strong> Оклад, вес за базу, ступени грейдов и параметры чека — пример для обсуждения с Галиной, точные цифры ещё не утверждены.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
