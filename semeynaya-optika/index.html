<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Семейной оптики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.SO_NORMS;
  var N = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }
  function round1(x) { return Math.round(x * 10) / 10; }

  function planPct(s) { return s.planRevenue > 0 ? (s.revenue / s.planRevenue * 100) : 0; }
  function checkPct(s) { return N.чек.план > 0 ? (s.factCheck / N.чек.план * 100) : 100; }
  function checkCutApplied(s) { return checkPct(s) < N.чек.порогДоли; }
  function checkCutMultiplier(s) { return checkCutApplied(s) ? (N.чек.урезаниеДо / 100) : 1; }

  function totalRate(s) {
    return API.gradeRate(N.грейды, planPct(s)) + API.gradeRate(N.базаСтупени, s.reactivationPct);
  }

  // Подсказка под полем «личная выручка» — сколько ещё нужно до следующей
  // ступени грейда и сколько это денег.
  function gradeHint(s) {
    var pp = planPct(s);
    var cur = API.gradeRate(N.грейды, pp);
    var ng = API.nextGrade(N.грейды, pp);
    if (!ng) {
      return 'Личный план уже в верхней ступени — грейд <span class="mono">' + pct(cur) + '</span>.';
    }
    var neededRevenue = Math.max(0, (ng.порог - pp) / 100 * s.planRevenue);
    var jump = (ng.ставка - cur) * (s.revenue + neededRevenue) * checkCutMultiplier(s);
    return 'До ступени <span class="mono">' + ng.порог + '%</span> не хватает <span class="mono">' +
      fmtMoney(neededRevenue) + '</span> личной выручки — грейд вырастет с <span class="mono">' + pct(cur) +
      '</span> до <span class="mono">' + pct(ng.ставка) + '</span>, это ещё <span class="mono">+' +
      fmtMoney(jump) + '/мес</span>.';
  }

  // Подсказка под полем «% возврата из базы» — это общий показатель сети, не
  // личный, поэтому подсказка говорит «у всех», а не «у тебя».
  function baseHint(s) {
    var cur = API.gradeRate(N.базаСтупени, s.reactivationPct);
    var ng = API.nextGrade(N.базаСтупени, s.reactivationPct);
    if (!ng) {
      return 'Верхняя ступень — надбавка <span class="mono">+' + pct(cur) + '</span> у всех консультантов.';
    }
    var gap = ng.порог - s.reactivationPct;
    var jump = (ng.ставка - cur) * s.revenue * checkCutMultiplier(s);
    return 'Это общий показатель сети, не личный. До ступени <span class="mono">' + ng.порог + '%</span> не хватает <span class="mono">' +
      round1(gap) + ' п.п.</span> возврата из базы — тогда у всех надбавка вырастет до <span class="mono">+' + pct(ng.ставка) +
      '</span>, у тебя это ещё <span class="mono">+' + fmtMoney(jump) + '/мес</span>.';
  }

  // Подсказка под полем «средний чек».
  function checkHint(s) {
    var cp = checkPct(s);
    if (cp >= N.чек.порогДоли) {
      return 'Чек в норме — премия не урезается (порог <span class="mono">' + N.чек.порогДоли + '%</span> от планового <span class="mono">' + fmtMoney(N.чек.план) + '</span>).';
    }
    var neededCheck = N.чек.план * N.чек.порогДоли / 100;
    var gap = neededCheck - s.factCheck;
    var rate = totalRate(s);
    var lost = rate * s.revenue * (1 - N.чек.урезаниеДо / 100);
    return 'Чек ниже порога — премия урезана до <span class="mono">' + N.чек.урезаниеДо + '%</span>. Не хватает <span class="mono">' +
      fmtMoney(gap) + '</span> до <span class="mono">' + fmtMoney(neededCheck) + '</span> — это вернёт <span class="mono">+' + fmtMoney(lost) + '/мес</span>.';
  }

  function stepsFootnote(ступени, fmtStep) {
    return ступени.map(function (g, i) {
      if (i === 0) return 'меньше ' + (ступени[1] ? ступени[1].порог : 100) + '% — ' + fmtStep(g.ставка);
      if (!ступени[i + 1]) return 'от ' + g.порог + '% и выше — ' + fmtStep(g.ставка);
      return g.порог + '–' + (ступени[i + 1].порог - 1) + '% — ' + fmtStep(g.ставка);
    }).join('; ');
  }

  var role = {
    id: 'консультант',
    label: 'Консультант',
    groups: [
      {
        title: 'План и выручка',
        note: 'Ставка грейда зависит от твоей личной выручки относительно твоего личного плана.',
        fields: [
          { id: 'planRevenue', label: 'Личный план на месяц', unit: 'money', key: true,
            min: 200000, max: 2000000, step: 50000, default: 1000000,
            marginal: function (s) { return gradeHint(s); } },
          { id: 'revenue', label: 'Личная выручка (факт)', unit: 'money', key: true,
            min: 0, max: 2000000, step: 10000, default: 790000 }
        ]
      },
      {
        title: 'Работа сети с базой',
        note: 'Общий показатель всей сети за месяц, не личный — но двигает ставку каждому консультанту сразу, когда база в целом работает лучше.',
        fields: [
          { id: 'reactivationPct', label: '% клиентов, вернувшихся из базы за месяц (по сети)', unit: 'percent', key: true,
            min: 0, max: 30, step: 0.5, default: 9,
            marginal: function (s) { return baseHint(s); } }
        ]
      },
      {
        title: 'Средний чек',
        note: 'Ограничитель, не отдельная премия: низкий чек урезает итоговую премию.',
        fields: [
          { id: 'factCheck', label: 'Средний чек (факт)', unit: 'money', key: true,
            min: 2000, max: 15000, step: 100, default: 5500,
            marginal: function (s) { return checkHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var pp = planPct(s);
      var gradeRate = API.gradeRate(N.грейды, pp);
      var baseBonus = API.gradeRate(N.базаСтупени, s.reactivationPct);
      var rate = gradeRate + baseBonus;
      var cutMult = checkCutMultiplier(s);

      var grossBonus = rate * s.revenue;
      var bonus = grossBonus * cutMult;
      var cutLoss = grossBonus - bonus;

      var rows = [
        { label: 'Оклад', value: N.оклад },
        { label: 'Грейд по личному плану — ' + pct(gradeRate) + ' (план ' + round1(pp) + '%)', value: gradeRate * s.revenue * cutMult }
      ];
      if (baseBonus > 0) {
        rows.push({ label: 'Надбавка за возврат из базы по сети — +' + pct(baseBonus) + ' (сейчас ' + s.reactivationPct + '%)', value: baseBonus * s.revenue * cutMult });
      }
      if (cutLoss > 1) {
        rows.push({ label: '— минус урезание за низкий чек', value: -cutLoss });
      }

      return {
        rows: rows,
        total: N.оклад + bonus,
        rate: rate, gradeRate: gradeRate, baseBonus: baseBonus, planPct: pp,
        cutApplied: checkCutApplied(s), cutLoss: cutLoss
      };
    },
    tip: function (c, s) {
      var moves = [];
      var ng = API.nextGrade(N.грейды, c.planPct);
      if (ng) {
        var neededRevenue = Math.max(0, (ng.порог - c.planPct) / 100 * s.planRevenue);
        moves.push({
          what: 'поднять личную выручку до ' + ng.порог + '% плана',
          money: (ng.ставка - c.gradeRate) * (s.revenue + neededRevenue) * checkCutMultiplier(s)
        });
      }
      var nb = API.nextGrade(N.базаСтупени, s.reactivationPct);
      if (nb) {
        moves.push({
          what: 'чтобы сеть подняла возврат из базы до ' + nb.порог + '%',
          money: (nb.ставка - c.baseBonus) * s.revenue * checkCutMultiplier(s)
        });
      }
      if (c.cutApplied) {
        moves.push({ what: 'поднять средний чек выше порога и снять урезание премии', money: c.cutLoss });
      }
      if (!moves.length) {
        return '<strong>Дальше расти в этой модели некуда</strong> — ставка ' + pct(c.rate) + ' уже максимальная, чек в норме.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Семейная оптика · мотивация консультантов',
    favicon: '👨‍👩‍👧',
    theme: { accent: 'oklch(0.6 0.16 25)', accentDark: 'oklch(0.72 0.14 25)' },
    lede: 'Зарплата = оклад + процент с личной выручки. Процент складывается из двух частей: грейда за выполнение личного плана и надбавки за то, как вся сеть работает с базой (возвращает клиентов, которые давно не приходили). Низкий средний чек урезает премию. Впиши реальные цифры, нажми «Зафиксировать как сейчас» — и смотри, что выгоднее всего подтянуть.',
    footnotes: [
      '<strong>Зарплата = оклад + % с личной выручки, где % = грейд по личному плану + надбавка за работу сети с базой, с урезанием за низкий чек.</strong>',
      '<strong>Грейд по личному плану:</strong> ' + stepsFootnote(N.грейды, pct) + '.',
      '<strong>Надбавка за % возврата из базы по сети</strong> (общий показатель, не личный — считается по всей сети за месяц): ' + stepsFootnote(N.базаСтупени, function (v) { return '+' + pct(v); }) + '. Эта часть одинаковая у всех консультантов сразу — чтобы не спорить, кто именно вернул конкретного клиента: звонил один, а в зале обслужил другой. Если база в целом работает лучше — ставка растёт у всех.',
      'Средний чек — не отдельная премия, а ограничитель: план ' + fmtMoney(N.чек.план) + '. Если факт ниже ' + N.чек.порогДоли + '% от этой суммы — премия урезается до ' + N.чек.урезаниеДо + '% от расчётной, чтобы план нельзя было закрыть одними скидками.',
      '<strong>Это черновик.</strong> Оклад, грейды, ступени за возврат из базы и параметры чека — пример для обсуждения с Галиной, точные цифры ещё не утверждены. Отправная точка по базе — её текущая цифра (~9%), ступени поставлены чуть выше.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
