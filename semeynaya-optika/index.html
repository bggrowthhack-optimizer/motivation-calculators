<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Семейной оптики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.SO_NORMS;
  var N = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }

  function checkPct(s) { return N.чек.план > 0 ? (s.factCheck / N.чек.план * 100) : 100; }
  function checkCutApplied(s) { return checkPct(s) < N.чек.порогДоли; }
  function checkCutMultiplier(s) { return checkCutApplied(s) ? (N.чек.урезаниеДо / 100) : 1; }

  function gradeOnlyRate(s) { return API.gradeRate(N.грейды, s.planPct); }
  function zapisiVypolnena(s) { return s.записиКоличество >= N.записи.норма; }
  function zapisiAdjustment(s) { return zapisiVypolnena(s) ? N.записи.надбавка : -N.записи.надбавка; }
  function totalRate(s) { return Math.max(0, gradeOnlyRate(s) + zapisiAdjustment(s)); }

  // Подсказка под полем «план филиала» — простыми словами, без «п.п.» и «грейда».
  function gradeHint(s) {
    var cur = API.gradeRate(N.грейды, s.planPct);
    var ng = API.nextGrade(N.грейды, s.planPct);
    if (!ng) {
      return 'Филиал уже в самой высокой ступени плана — у тебя максимальный процент, <span class="mono">' + pct(cur) + '</span>.';
    }
    var jump = (ng.ставка - cur) * s.revenue * checkCutMultiplier(s);
    return 'Сейчас план выполнен на <span class="mono">' + s.planPct + '%</span>. Как только филиал дойдёт до <span class="mono">' + ng.порог +
      '%</span>, твой процент вырастет с <span class="mono">' + pct(cur) + '</span> до <span class="mono">' + pct(ng.ставка) +
      '</span> — это ещё <span class="mono">+' + fmtMoney(jump) + ' в месяц</span>.';
  }

  // Подсказка под полем «средний чек».
  function checkHint(s) {
    var cp = checkPct(s);
    if (cp >= N.чек.порогДоли) {
      return 'Чек в порядке — премию за это не срезают.';
    }
    var neededCheck = N.чек.план * N.чек.порогДоли / 100;
    var gap = neededCheck - s.factCheck;
    var lost = totalRate(s) * s.revenue * (1 - N.чек.урезаниеДо / 100);
    return 'Чек маловат, поэтому премию срезают. Если он станет хотя бы <span class="mono">' + fmtMoney(neededCheck) +
      '</span> (не хватает <span class="mono">' + fmtMoney(gap) + '</span>) — вернёшь себе <span class="mono">+' + fmtMoney(lost) + ' в месяц</span>.';
  }

  // Подсказка под полем «твоя выручка» — на сколько живых рублей растёт зарплата.
  function revenueHint(s) {
    var gain = totalRate(s) * 10000 * checkCutMultiplier(s);
    return 'Каждые +10 000 ₽ твоей выручки — это ещё <span class="mono">+' + fmtMoney(gain) + ' к зарплате</span> (при текущем проценте <span class="mono">' + pct(totalRate(s)) + '</span>).';
  }

  // Подсказка под полем «сколько записала» — прогресс до нормы и эффект в рублях.
  function zapisiHint(s) {
    var effect = N.записи.надбавка * s.revenue * checkCutMultiplier(s);
    var swing = 2 * effect;
    if (zapisiVypolnena(s)) {
      return 'Норму (<span class="mono">' + N.записи.норма + '</span>) ты выполнила — это даёт тебе <span class="mono">+' + fmtMoney(effect) + ' в месяц</span>. Если в следующем месяце запишешь меньше <span class="mono">' + N.записи.норма + '</span> — вместо этого будет <span class="mono">−' + fmtMoney(effect) + '</span> (разница <span class="mono">' + fmtMoney(swing) + '</span>).';
    }
    var gap = N.записи.норма - s.записиКоличество;
    return 'До нормы (<span class="mono">' + N.записи.норма + '</span>) не хватает <span class="mono">' + gap + '</span>. Сейчас из-за этого <span class="mono">−' + fmtMoney(effect) +
      ' в месяц</span>. Запишешь ещё <span class="mono">' + gap + '</span> — вместо минуса будет <span class="mono">+' + fmtMoney(effect) + '</span> (разница <span class="mono">' + fmtMoney(swing) + '</span>).';
  }

  function gradeFootnote() {
    var steps = N.грейды.map(function (g, i) {
      if (i === 0) return 'меньше ' + (N.грейды[1] ? N.грейды[1].порог : 100) + '% — ' + pct(g.ставка);
      if (!N.грейды[i + 1]) return 'от ' + g.порог + '% и выше — ' + pct(g.ставка);
      return g.порог + '–' + (N.грейды[i + 1].порог - 1) + '% — ' + pct(g.ставка);
    });
    return '<strong>Сколько процентов от твоей выручки ты получаешь, в зависимости от плана филиала:</strong> ' + steps.join('; ') + '.';
  }

  var role = {
    id: 'консультант',
    label: 'Консультант',
    groups: [
      {
        title: 'План и выручка',
        note: 'Твой процент зависит от того, как весь филиал выполнил план — не только от твоих личных продаж. А вот сумма в рублях считается с твоей личной выручки.',
        fields: [
          { id: 'planPct', label: 'Филиал выполнил план продаж на сколько %', unit: 'percent', key: true,
            min: 0, max: 140, step: 1, default: 90,
            marginal: function (s) { return gradeHint(s); } },
          { id: 'revenue', label: 'Твоя выручка за месяц', unit: 'money', key: true,
            min: 0, max: 2000000, step: 10000, default: 790000,
            marginal: function (s) { return revenueHint(s); } }
        ]
      },
      {
        title: 'Записи из базы',
        note: 'Норма — ' + N.записи.норма + ' в месяц. Наберёшь норму — процент выше, не наберёшь — ниже. Считается по записям в CRM.',
        fields: [
          { id: 'записиКоличество', label: 'Сколько клиентов из базы ты записала на приём в этом месяце', unit: 'count', key: true,
            min: 0, max: 30, step: 1, default: 10,
            marginal: function (s) { return zapisiHint(s); } }
        ]
      },
      {
        title: 'Средний чек',
        note: 'Если чек маленький, премию немного срежут — чтобы план не закрывали одними скидками.',
        fields: [
          { id: 'factCheck', label: 'Твой средний чек', unit: 'money', key: true,
            min: 2000, max: 15000, step: 100, default: 5500,
            marginal: function (s) { return checkHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var gradeRate = gradeOnlyRate(s);
      var adj = zapisiAdjustment(s);
      var rate = totalRate(s);
      var cutMult = checkCutMultiplier(s);

      var grossBonus = rate * s.revenue;
      var bonus = grossBonus * cutMult;
      var cutLoss = grossBonus - bonus;

      var rows = [
        { label: 'Оклад', value: N.оклад },
        { label: 'Процент с выручки — ' + pct(gradeRate) + ' (план филиала ' + s.planPct + '%)', value: gradeRate * s.revenue * cutMult },
        { label: zapisiVypolnena(s) ? 'Прибавка за записи из базы (' + s.записиКоличество + ' из ' + N.записи.норма + ', норма выполнена)' : 'Вычет за записи из базы (' + s.записиКоличество + ' из ' + N.записи.норма + ', не хватило)', value: adj * s.revenue * cutMult }
      ];
      if (cutLoss > 1) {
        rows.push({ label: '— минус за маленький чек', value: -cutLoss });
      }

      return {
        rows: rows,
        total: N.оклад + bonus,
        rate: rate, gradeRate: gradeRate, cutApplied: checkCutApplied(s), cutLoss: cutLoss
      };
    },
    tip: function (c, s) {
      var moves = [];
      var ng = API.nextGrade(N.грейды, s.planPct);
      if (ng) {
        moves.push({
          what: 'подтянуть план филиала до ' + ng.порог + '%',
          money: (ng.ставка - c.gradeRate) * s.revenue * checkCutMultiplier(s)
        });
      }
      if (!zapisiVypolnena(s)) {
        moves.push({
          what: 'записать ещё ' + (N.записи.норма - s.записиКоличество) + ' клиентов из базы, чтобы дотянуть до нормы ' + N.записи.норма,
          money: 2 * N.записи.надбавка * s.revenue * checkCutMultiplier(s)
        });
      }
      if (c.cutApplied) {
        moves.push({ what: 'поднять средний чек, чтобы премию не срезали', money: c.cutLoss });
      }
      if (!moves.length) {
        return '<strong>Дальше расти в этой модели некуда</strong> — процент уже максимальный, норма по записям выполнена, чек в порядке.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Семейная оптика · мотивация консультантов',
    favicon: '👨‍👩‍👧',
    theme: { accent: 'oklch(0.6 0.16 25)', accentDark: 'oklch(0.72 0.14 25)' },
    lede: 'Из чего складывается зарплата: оклад + процент от твоей выручки + запись клиентов из базы + средний чек. Впиши свои цифры и сразу увидишь сумму. Нажми «Зафиксировать как сейчас», чтобы увидеть, сколько можно прибавить.',
    footnotes: [
      '<strong>Зарплата = оклад + процент от твоей выручки.</strong> Процент зависит от того, как филиал выполнил план, и от того, записала ли ты своих клиентов из базы. Если средний чек маленький, премию немного срезают.',
      gradeFootnote(),
      '<strong>Записи из базы:</strong> норма — ' + N.записи.норма + ' записей в месяц (сколько клиентов из базы ты сама записала на приём, считается по CRM). Выполнила — процент выше на ' + pct(N.записи.надбавка) + ', не выполнила — ниже на ' + pct(N.записи.надбавка) + '.',
      '<strong>Средний чек:</strong> плановый — ' + fmtMoney(N.чек.план) + '. Если твой факт ниже ' + N.чек.порогДоли + '% от этой суммы, премию урезают до ' + N.чек.урезаниеДо + '% от расчётной.',
      '<strong>Это черновик.</strong> Оклад, проценты, норма записей и чек — пример для обсуждения с Галиной. Точные цифры ещё не утверждены.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
