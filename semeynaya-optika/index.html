<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мотивация Семейной оптики</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.SO_NORMS;
  var N = API.load();

  function pct(x) { return (Math.round(x * 1000) / 10).toString().replace('.', ',') + '%'; }

  function checkPct(s) { return N.чек.план > 0 ? (s.factCheck / N.чек.план * 100) : 100; }
  function checkCutApplied(s) { return checkPct(s) < N.чек.порогДоли; }
  function checkCutMultiplier(s) { return checkCutApplied(s) ? (N.чек.урезаниеДо / 100) : 1; }

  // Подсказка под полем «план филиала» — сколько п.п. до следующей ступени
  // грейда и сколько это денег при текущей личной выручке.
  function gradeHint(s) {
    var cur = API.gradeRate(N.грейды, s.planPct);
    var ng = API.nextGrade(N.грейды, s.planPct);
    if (!ng) {
      return 'План филиала уже в верхней ступени — ставка <span class="mono">' + pct(cur) + '</span>.';
    }
    var gap = ng.порог - s.planPct;
    var jump = (ng.ставка - cur) * s.revenue * checkCutMultiplier(s);
    return 'До <span class="mono">' + ng.порог + '%</span> плана филиала осталось <span class="mono">' + gap.toFixed(0) +
      ' п.п.</span> — ставка вырастет с <span class="mono">' + pct(cur) + '</span> до <span class="mono">' + pct(ng.ставка) +
      '</span>, это ещё <span class="mono">+' + fmtMoney(jump) + '/мес</span>.';
  }

  // Подсказка под полем «средний чек».
  function checkHint(s) {
    var cp = checkPct(s);
    if (cp >= N.чек.порогДоли) {
      return 'Чек в норме — премия не урезается (порог <span class="mono">' + N.чек.порогДоли + '%</span> от планового <span class="mono">' + fmtMoney(N.чек.план) + '</span>).';
    }
    var neededCheck = N.чек.план * N.чек.порогДоли / 100;
    var gap = neededCheck - s.factCheck;
    var rate = API.gradeRate(N.грейды, s.planPct);
    var lost = rate * s.revenue * (1 - N.чек.урезаниеДо / 100);
    return 'Чек ниже порога — премия урезана до <span class="mono">' + N.чек.урезаниеДо + '%</span>. Не хватает <span class="mono">' +
      fmtMoney(gap) + '</span> до <span class="mono">' + fmtMoney(neededCheck) + '</span> — это вернёт <span class="mono">+' + fmtMoney(lost) + '/мес</span>.';
  }

  function gradeFootnote() {
    var steps = N.грейды.map(function (g, i) {
      if (i === 0) return 'меньше ' + (N.грейды[1] ? N.грейды[1].порог : 100) + '% — ' + pct(g.ставка);
      if (!N.грейды[i + 1]) return 'от ' + g.порог + '% и выше — ' + pct(g.ставка);
      return g.порог + '–' + (N.грейды[i + 1].порог - 1) + '% — ' + pct(g.ставка);
    });
    return '<strong>Процент с личной выручки по выполнению плана филиала:</strong> ' + steps.join('; ') + '.';
  }

  var role = {
    id: 'консультант',
    label: 'Консультант',
    groups: [
      {
        title: 'План и выручка',
        note: 'Ставка зависит от того, как филиал в целом выполнил план — не от того, сколько лично продал консультант. Деньги при этом считаются с личной выручки.',
        fields: [
          { id: 'planPct', label: 'На сколько филиал выполнил план продаж', unit: 'percent', key: true,
            min: 0, max: 140, step: 1, default: 90,
            marginal: function (s) { return gradeHint(s); } },
          { id: 'revenue', label: 'Личная выручка за месяц (общая, не только по заказам)', unit: 'money', key: true,
            min: 0, max: 2000000, step: 10000, default: 790000 }
        ]
      },
      {
        title: 'Прозвон базы',
        note: 'Личная норма — сделал нужное количество звонков по базе или нет. Без градаций: выполнено/не выполнено, проверяется по CRM, не по тому, кто обслужил клиента в зале.',
        fields: [
          { id: 'прозвонВыполнен', label: 'Норма прозвона выполнена (' + N.прозвон.норма + ' звонков/мес)', type: 'checkbox', default: false }
        ]
      },
      {
        title: 'Средний чек',
        note: 'Ограничитель, не отдельная премия: низкий чек урезает премию за план.',
        fields: [
          { id: 'factCheck', label: 'Средний чек (факт)', unit: 'money', key: true,
            min: 2000, max: 15000, step: 100, default: 5500,
            marginal: function (s) { return checkHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var rate = API.gradeRate(N.грейды, s.planPct);
      var cutMult = checkCutMultiplier(s);

      var grossBonus = rate * s.revenue;
      var bonus = grossBonus * cutMult;
      var cutLoss = grossBonus - bonus;
      var прозвонПремия = s.прозвонВыполнен ? N.прозвон.премия : 0;

      var rows = [
        { label: 'Оклад', value: N.оклад },
        { label: 'Процент с выручки — ' + pct(rate) + ' (план филиала ' + s.planPct + '%)', value: bonus }
      ];
      if (прозвонПремия > 0) {
        rows.push({ label: 'Премия за норму прозвона базы', value: прозвонПремия });
      }
      if (cutLoss > 1) {
        rows.push({ label: '— минус урезание за низкий чек', value: -cutLoss });
      }

      return {
        rows: rows,
        total: N.оклад + bonus + прозвонПремия,
        rate: rate, cutApplied: checkCutApplied(s), cutLoss: cutLoss, прозвонПремия: прозвонПремия
      };
    },
    tip: function (c, s) {
      var moves = [];
      var ng = API.nextGrade(N.грейды, s.planPct);
      if (ng) {
        moves.push({
          what: 'подтянуть план филиала до ' + ng.порог + '%',
          money: (ng.ставка - c.rate) * s.revenue * checkCutMultiplier(s)
        });
      }
      if (!s.прозвонВыполнен) {
        moves.push({ what: 'выполнить норму прозвона базы (' + N.прозвон.норма + ' звонков)', money: N.прозвон.премия });
      }
      if (c.cutApplied) {
        moves.push({ what: 'поднять средний чек выше порога и снять урезание премии', money: c.cutLoss });
      }
      if (!moves.length) {
        return '<strong>Дальше расти в этой модели некуда</strong> — ставка ' + pct(c.rate) + ' уже максимальная, прозвон сделан, чек в норме.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты',
    eyebrow: 'Семейная оптика · мотивация консультантов',
    favicon: '👨‍👩‍👧',
    theme: { accent: 'oklch(0.6 0.16 25)', accentDark: 'oklch(0.72 0.14 25)' },
    lede: 'Зарплата = оклад + процент с личной выручки по тому, как филиал выполнил план, + премия за выполненную норму прозвона базы. Низкий средний чек урезает премию. Впиши реальные цифры, нажми «Зафиксировать как сейчас» — и смотри, что выгоднее всего подтянуть.',
    footnotes: [
      '<strong>Зарплата = оклад + % с личной выручки по плану филиала + премия за прозвон, с урезанием за низкий чек.</strong>',
      gradeFootnote(),
      'Личная выручка — общая, не только то, что оформлено как «заказ»: все продажи консультанта за месяц.',
      '<strong>Прозвон базы:</strong> норма ' + N.прозвон.норма + ' звонков в месяц. Выполнено/не выполнено — без градаций, премия ' + fmtMoney(N.прозвон.премия) + '. Проверяется по звонкам в CRM/телефонии, а не по тому, кто в зале обслужил вернувшегося клиента — поэтому нет споров об атрибуции конкретной продажи.',
      'Средний чек — не отдельная премия, а ограничитель: план ' + fmtMoney(N.чек.план) + '. Если факт ниже ' + N.чек.порогДоли + '% от этой суммы — премия урезается до ' + N.чек.урезаниеДо + '% от расчётной, чтобы план нельзя было закрыть одними скидками.',
      '<strong>Это черновик.</strong> Оклад, грейды, норма прозвона и параметры чека — пример для обсуждения с Галиной, точные цифры ещё не утверждены.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
