<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Калькулятор зарплаты РОПа — шаблон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/engine.css">
</head>
<body>
<div id="app"></div>
<script src="./norms.js"></script>
<script src="../assets/engine.js"></script>
<script>
(function () {
  var fmtMoney = MotivationCalculator.util.fmtMoney;
  var API = window.ROP_NORMS;
  var N = API.load();

  function planPart(s) { return API.stepAmount(N.ступени, s.planPct); }
  function checkDone(s) { return s.factCheck >= N.kpiЧек.план; }
  function convDone(s) { return s.factConv >= N.kpiКонверсия.план; }
  function checkPart(s) { return checkDone(s) ? N.kpiЧек.премия : 0; }
  function convPart(s) { return convDone(s) ? N.kpiКонверсия.премия : 0; }
  function kpiSum(s) { return planPart(s) + checkPart(s) + convPart(s); }
  function topUp(s) { return Math.max(0, N.минималкаKpi - kpiSum(s)); }
  function total(s) { return N.оклад + kpiSum(s) + topUp(s); }

  // Реальная прибавка к итогу, если подставить значения patch (с учётом минимума).
  function gain(s, patch) {
    return total(Object.assign({}, s, patch)) - total(s);
  }

  function gainText(g) {
    if (g > 0) return 'Дотянете — <span class="mono">+' + fmtMoney(g) + '</span>.';
    return 'Сейчас к зарплате это ничего не добавит: сумма KPI ещё ниже гарантированного минимума (<span class="mono">' + fmtMoney(N.минималкаKpi) + '</span>).';
  }

  function planHint(s) {
    var cur = planPart(s);
    var ns = API.nextStep(N.ступени, s.planPct);
    if (!ns) {
      return 'Куст в самой высокой ступени плана — премия максимальная, <span class="mono">' + fmtMoney(cur) + '</span>.';
    }
    var g = gain(s, { planPct: ns.порог });
    return 'Сейчас план куста выполнен на <span class="mono">' + s.planPct + '%</span>. При <span class="mono">' + ns.порог +
      '%</span> премия вырастет с <span class="mono">' + fmtMoney(cur) + '</span> до <span class="mono">' + fmtMoney(ns.сумма) + '</span>. ' +
      (g > 0 ? 'К зарплате это <span class="mono">+' + fmtMoney(g) + ' в месяц</span>.' : 'К зарплате пока ничего не добавит: сумма KPI ниже гарантированного минимума (<span class="mono">' + fmtMoney(N.минималкаKpi) + '</span>).');
  }

  function checkHint(s) {
    if (checkDone(s)) {
      return 'Норма среднего чека (<span class="mono">' + fmtMoney(N.kpiЧек.план) + '</span>) выполнена — премия <span class="mono">' + fmtMoney(N.kpiЧек.премия) + '</span>.';
    }
    return 'До нормы среднего чека не хватает <span class="mono">' + fmtMoney(N.kpiЧек.план - s.factCheck) + '</span>. ' +
      gainText(gain(s, { factCheck: N.kpiЧек.план }));
  }

  function convHint(s) {
    if (convDone(s)) {
      return 'Норма конверсии (<span class="mono">' + N.kpiКонверсия.план + '%</span>) выполнена — премия <span class="mono">' + fmtMoney(N.kpiКонверсия.премия) + '</span>.';
    }
    var gap = Math.round((N.kpiКонверсия.план - s.factConv) * 10) / 10;
    return 'До нормы конверсии не хватает <span class="mono">' + gap + ' п.п.</span> ' +
      gainText(gain(s, { factConv: N.kpiКонверсия.план }));
  }

  function stepsFootnote() {
    var steps = N.ступени.map(function (g, i) {
      if (i === 0) return 'меньше ' + (N.ступени[1] ? N.ступени[1].порог : 100) + '% — ' + fmtMoney(g.сумма);
      if (!N.ступени[i + 1]) return 'от ' + g.порог + '% и выше — ' + fmtMoney(g.сумма);
      return g.порог + '–' + (N.ступени[i + 1].порог - 1) + '% — ' + fmtMoney(g.сумма);
    });
    return '<strong>Премия за выполнение плана куста:</strong> ' + steps.join('; ') + '.';
  }

  var minTotal = N.оклад + N.минималкаKpi;
  var maxTotal = N.оклад + Math.max(N.минималкаKpi,
    N.ступени[N.ступени.length - 1].сумма + N.kpiЧек.премия + N.kpiКонверсия.премия);

  var role = {
    id: 'роп',
    label: 'РОП',
    groups: [
      {
        title: 'План куста',
        note: 'Премия зависит от того, как куст выполнил план продаж.',
        collapsible: true,
        sum: function (s) { return planPart(s); },
        fields: [
          { id: 'planPct', label: 'Куст выполнил план продаж на сколько %', unit: 'percent', key: true,
            min: 0, max: 140, step: 1, default: 100,
            marginal: function (s) { return planHint(s); } }
        ]
      },
      {
        title: 'KPI куста',
        note: 'Каждый KPI бинарный: норма выполнена — премия, не выполнена — ноль. Сумма всех KPI не опускается ниже ' + fmtMoney(N.минималкаKpi) + '.',
        collapsible: true,
        sum: function (s) { return checkPart(s) + convPart(s); },
        fields: [
          { id: 'factCheck', label: 'Средний чек куста', unit: 'money', key: true,
            min: 5000, max: 40000, step: 500, default: 20000,
            marginal: function (s) { return checkHint(s); } },
          { id: 'factConv', label: 'Конверсия', unit: 'percent', key: true,
            min: 0, max: 100, step: 1, default: 75,
            marginal: function (s) { return convHint(s); } }
        ]
      }
    ],
    compute: function (s) {
      var rows = [
        { label: 'Оклад', value: N.оклад },
        { label: 'Премия за план куста (' + s.planPct + '%)', value: planPart(s) },
        { label: 'KPI «Средний чек»' + (checkDone(s) ? '' : ' (не выполнен)'), value: checkPart(s) },
        { label: 'KPI «Конверсия»' + (convDone(s) ? '' : ' (не выполнен)'), value: convPart(s) }
      ];
      if (topUp(s) > 0) {
        rows.push({ label: 'Доплата до гарантированного минимума KPI', value: topUp(s) });
      }
      return { rows: rows, total: total(s) };
    },
    tip: function (c, s) {
      var moves = [];
      var ns = API.nextStep(N.ступени, s.planPct);
      if (ns) moves.push({ what: 'подтянуть план куста до ' + ns.порог + '%', money: gain(s, { planPct: ns.порог }) });
      if (!checkDone(s)) moves.push({ what: 'довести средний чек до нормы ' + fmtMoney(N.kpiЧек.план), money: gain(s, { factCheck: N.kpiЧек.план }) });
      if (!convDone(s)) moves.push({ what: 'довести конверсию до нормы ' + N.kpiКонверсия.план + '%', money: gain(s, { factConv: N.kpiКонверсия.план }) });
      if (!moves.length) {
        return '<strong>Дальше расти в этой модели некуда</strong> — премия за план максимальная, оба KPI выполнены.';
      }
      moves.sort(function (a, b) { return b.money - a.money; });
      var m = moves[0];
      if (m.money <= 0) {
        return '<strong>Пока сумма KPI ниже гарантированного минимума (' + fmtMoney(N.минималкаKpi) + ')</strong> — по одному показателю прибавки нет. Нужно выполнить сразу несколько.';
      }
      return '<strong>Быстрее всего прибавить:</strong> ' + m.what + ' — это примерно <strong>+' + fmtMoney(m.money) + ' в месяц</strong>.';
    }
  };

  MotivationCalculator.init({
    title: 'Калькулятор зарплаты РОПа',
    eyebrow: 'Шаблон · мотивация руководителя отдела продаж',
    favicon: '📈',
    lede: 'Из чего складывается зарплата: оклад + премия за план куста + премии за KPI. Вилка — от ' + fmtMoney(minTotal) + ' до ' + fmtMoney(maxTotal) + '. Впишите показатели и сразу увидите сумму. Нажмите «Зафиксировать как сейчас», чтобы увидеть, сколько можно прибавить.',
    footnotes: [
      '<strong>Зарплата = оклад + KPI-часть.</strong> Оклад ' + fmtMoney(N.оклад) + ' выплачивается всегда. KPI-часть — премия за план куста плюс премии за средний чек и конверсию, но не меньше ' + fmtMoney(N.минималкаKpi) + ' (гарантированный минимум). Суммы фиксированные и не зависят от выручки, поэтому итог всегда в вилке ' + fmtMoney(minTotal) + ' — ' + fmtMoney(maxTotal) + '.',
      stepsFootnote(),
      '<strong>KPI:</strong> средний чек — норма ' + fmtMoney(N.kpiЧек.план) + ', премия ' + fmtMoney(N.kpiЧек.премия) + '; конверсия — норма ' + N.kpiКонверсия.план + '%, премия ' + fmtMoney(N.kpiКонверсия.премия) + '. Выплата целиком, если факт не ниже нормы.',
      '<strong>Это обезличенный черновик.</strong> Оклад, нормы чека и конверсии, вилка и гарантированный минимум заданы; суммы ступеней плана и размер KPI-премий подобраны под вилку и не согласованы.'
    ],
    roles: [role]
  });
})();
</script>
</body>
</html>
